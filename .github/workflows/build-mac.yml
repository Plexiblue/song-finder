name: Mac-App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest       # Apple Silicon (M1–M4)
            arch: AppleSilicon
          - runner: macos-15-intel     # ältere Intel-Macs
            arch: Intel
    runs-on: ${{ matrix.runner }}
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Versionsnummer setzen
        run: |
          sed -i '' "s/^VERSION = .*/VERSION = \"$APP_VERSION\"/" appinfo.py
          sed -i '' "s/^__version__ = .*/__version__ = \"$APP_VERSION\"/" songfinder/__init__.py
          cat appinfo.py | grep VERSION

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt

      - name: App bauen
        run: pyinstaller packaging/SongFinder.spec --noconfirm

      - name: App signieren (ad-hoc)
        run: codesign --force --deep --sign - "dist/Song Finder.app"

      - name: Selbsttest der fertigen App
        run: |
          "dist/Song Finder.app/Contents/MacOS/SongFinder" --selftest selftest.txt || true
          cat selftest.txt
          grep -q "SELFTEST BESTANDEN" selftest.txt

      - name: DMG erstellen
        run: |
          mkdir dmg
          cp -R "dist/Song Finder.app" dmg/
          ln -s /Applications dmg/Programme
          hdiutil create -volname "Song Finder" -srcfolder dmg -ov -format UDZO \
            "SongFinder-Mac-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: SongFinder-Mac-${{ matrix.arch }}
          path: SongFinder-Mac-${{ matrix.arch }}.dmg

  release:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Prüfen, ob etwas gebaut wurde
        run: ls -la out && test -n "$(ls out/*.dmg 2>/dev/null)"

      - name: Update-Paket für die App (nur Programmcode)
        run: |
          sed -i "s/^__version__ = .*/__version__ = \"$APP_VERSION\"/" songfinder/__init__.py
          RUNTIME=$(grep '^RUNTIME' appinfo.py | grep -o '[0-9]*')
          find songfinder -name '__pycache__' -prune -exec rm -rf {} +
          zip -qr "out/songfinder-$APP_VERSION.zip" songfinder
          SHA=$(sha256sum "out/songfinder-$APP_VERSION.zip" | cut -d' ' -f1)
          REPO="${{ github.repository }}"
          cat > out/update.json <<JSON
          {"version": "$APP_VERSION", "min_runtime": $RUNTIME, "sha256": "$SHA",
           "url": "https://github.com/$REPO/releases/download/v$APP_VERSION/songfinder-$APP_VERSION.zip",
           "page": "https://github.com/$REPO/releases/latest"}
          JSON
          cat out/update.json

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Song Finder 1.0.${{ github.run_number }}
          make_latest: true
          files: |
            out/*.dmg
            out/*.zip
            out/update.json
          body: |
            ## Download
            * **Apple Silicon (M1, M2, M3, M4 …)** → `SongFinder-Mac-AppleSilicon.dmg`
            * **Intel-Mac** → `SongFinder-Mac-Intel.dmg`

            Welcher Mac? Apple-Menü  → „Über diesen Mac“ → steht bei „Chip“ *Apple M…*, nimm Apple Silicon.

            ## Installieren
            1. DMG öffnen und **Song Finder** auf **Programme** ziehen.
            2. Beim ersten Öffnen meldet macOS, dass die App nicht überprüft werden kann
               (sie ist nicht bei Apple registriert). Dann: **Systemeinstellungen → Datenschutz & Sicherheit**
               → ganz unten **„Dennoch öffnen“** klicken. Das ist nur einmal nötig.
