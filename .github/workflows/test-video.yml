name: Video testen (echt)

# Standard: nur YouTube-Musikangaben (kein Shazam). Shazam nur, wenn ausdrücklich gewünscht.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube-Link"
        required: true
      shazam:
        description: "Zusätzlich Shazam fragen (langsam, kann blockieren)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VIDEO_URL: ${{ inputs.url }}
      AUDD_TOKEN: ${{ secrets.AUDD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Analyse
        run: |
          EXTRA=""
          if [ "${{ inputs.shazam }}" = "true" ]; then EXTRA="--shazam --modus schnell"; fi
          python -m songfinder "$VIDEO_URL" $EXTRA --ki aus --json result.json
      - name: Ergebnis (JSON)
        if: always()
        run: test -f result.json && python -c "import json;r=json.load(open('result.json'));print(json.dumps({'yt_music':r['video'].get('yt_music'),'songs':[(s['title'],s['artist'],s['platform'],s.get('license')) for s in r['songs']],'credits':r['credits'],'stats':r['stats']},ensure_ascii=False,indent=1))" || true
